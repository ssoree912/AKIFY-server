plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.6' // Add this line back
}

group = 'com.jammering'
version = '0.0.1-SNAPSHOT'
java {
	toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot 스타터들은 BOM에서 버전을 관리하므로 버전 생략
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

	// Lombok은 직접 버전 명시
	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 기타 직접 버전 지정 필요 라이브러리
	implementation 'com.google.firebase:firebase-admin:9.2.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	implementation 'org.json:json:20160810'
	implementation 'javax.validation:validation-api:2.0.1.Final'
	implementation 'org.modelmapper:modelmapper:3.1.1'
	implementation 'com.amazonaws:aws-java-sdk-ses:1.12.758'
	implementation 'io.awspring.cloud:spring-cloud-starter-aws:2.4.4'

	// SpringDoc OpenAPI (버전은 Spring Boot BOM에서 관리)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
}