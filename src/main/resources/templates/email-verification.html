<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Akkipy 이메일 인증</title>
</head>
<body>
    <div style="font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ddd;">
        <h2 style="color: #333;">Akkipy 회원가입 인증</h2>
        <p>Akkipy에 가입해주셔서 감사합니다. 아래 인증 코드를 입력하여 회원가입을 완료해주세요.</p>
        <div style="background-color: #f5f5f5; padding: 15px; text-align: center; font-size: 24px; letter-spacing: 5px; margin: 20px 0;">
            <strong>{{verificationCode}}</strong>
        </div>
        <p>이 코드는 5분간 유효합니다.</p>
        <hr>
        <p style="font-size: 12px; color: #888;">본인이 요청하지 않은 경우 이 이메일을 무시해주세요.</p>
    </div>
</body>
</html>
